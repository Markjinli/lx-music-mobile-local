name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Restore release keystore
        shell: bash
        run: |
          # 正式签名密钥存放在仓库 Secrets，不随代码提交
          echo "${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}" | base64 --decode > "android/app/${{ secrets.KEYSTORE_STORE_FILE }}"

      - name: Tune Gradle memory
        shell: bash
        run: |
          # GitHub-hosted runner 约 7GB 内存，原 4g+2g metaspace 容易把 daemon OOM 杀掉
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m/' android/gradle.properties

      - name: Build Release APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" \
            -PMYAPP_UPLOAD_STORE_FILE="${{ secrets.KEYSTORE_STORE_FILE }}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${{ secrets.KEYSTORE_KEY_ALIAS }}" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${{ secrets.KEYSTORE_KEY_PASSWORD }}"

      - name: Remove keystore from workspace
        if: always()
        shell: bash
        run: rm -f "android/app/${{ secrets.KEYSTORE_STORE_FILE }}"

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: v${{ env.PACKAGE_VERSION }} (支持本地音乐版)
          body: |
            ## LX Music 移动版 v${{ env.PACKAGE_VERSION }}（支持本地音乐）

            在原版基础上新增**本地音乐**功能：在设置中选择本地文件夹并扫描音频文件，自动创建"本地音乐"列表。

            ### 与原版差异
            - 新增「本地音乐」扫描导入功能
            - 详细改动见 [README](https://github.com/Markjinli/lx-music-mobile-local#fork-说明)

            ### 安装说明
            - 本版为**正式签名**构建（非 debug），可直接在应用内更新。
            - 从 1.9.0.260919.1 及更早的 debug 版升级，签名不同，需要**先卸载旧版再安装**（歌单可在应用内从 GitHub 备份恢复）。
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge jsDelivr version.json cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/Markjinli/lx-music-mobile-local/publish/version.json"
          curl -fsS "https://purge.jsdelivr.net/gh/Markjinli/lx-music-mobile-local@master/publish/version.json"
